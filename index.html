<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARKAN STORE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #050b12;
      color: white;
    }

    header {
      background: #171717;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 2px solid #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 35px 20px 100px;
    }

    h1 {
      text-align: center;
      font-size: 38px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 35px;
    }

    .section-title {
      font-size: 26px;
      margin-bottom: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #07121c;
      border: 1px solid #344454;
      border-radius: 20px;
      padding: 25px;
    }

    .card h2 {
      margin-bottom: 12px;
    }

    .coin {
      color: #bbb;
      margin-bottom: 15px;
    }

    .price {
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #050b12;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    footer {
      text-align: center;
      color: #888;
      margin-top: 50px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    ARKAN STORE
  </header>

  <main class="container">

    <h1>ARKAN STORE</h1>

    <p class="subtitle">
      Top Up Game &amp; Joki Ring
    </p>

    <h2 class="section-title">
      Produk
    </h2>

    <div class="products">

      <div class="card">
        <h2>Top Up Game</h2>
        <p class="coin">Layanan top up game</p>
        <p class="price">Mulai Rp5.000</p>

        <button onclick="order('Top Up Game')">
          Pesan Sekarang
        </button>
      </div>

      <div class="card">
        <h2>Joki Ring</h2>
        <p class="coin">Layanan joki sesuai kebutuhan</p>
        <p class="price">Mulai Rp10.000</p>

        <button onclick="order('Joki Ring')">
          Pesan Sekarang
        </button>
      </div>

    </div>

    <footer>
      © 2026 ARKAN STORE
    </footer>

  </main>

  <script>
    function order(product) {
      alert("Kamu memilih: " + product);
    }
  </script>

</body>
</html>
