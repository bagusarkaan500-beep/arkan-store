<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARKAN STORE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #050b12;
      color: white;
    }

    header {
      background: #171717;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 2px solid #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 35px 20px 100px;
    }

    h1 {
      text-align: center;
      font-size: 38px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 35px;
    }

    .section-title {
      font-size: 26px;
      margin-bottom: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #07121c;
      border: 1px solid #344454;
      border-radius: 20px;
      padding: 25px;
    }

    .card h2 {
      margin-bottom: 12px;
    }

    .coin {
      color: #bbb;
      margin-bottom: 15px;
    }

    .price {
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 20px;
    }
